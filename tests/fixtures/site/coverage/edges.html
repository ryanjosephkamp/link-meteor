<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frames at the edges — coverage fixture</title>
<style>
body{margin:0;background:#f3f0e8;color:#26342e;font:16px/1.6 system-ui}main{max-width:760px;margin:auto;padding:24px}
h1{font-size:28px;margin:0 0 12px}h2{font-size:17px;margin:0 0 6px}section{padding:12px 16px;background:#fff;border:1px solid #d9ddd3;border-radius:10px;margin:12px 0}a{color:#1f6655}
iframe{display:block;width:100%;height:96px;border:1px solid #cbd3c5}
</style>
<!-- Frames that are easy to misreport, for 0.6.0: a notice and a frame from the other site; one
     this page sent to the other site without an address of its own; a frame with no size and one
     placed off the page (tracking frames); and a closed component holding a sandboxed frame written
     in the page, a hidden frame and a visible one from the other site. A synthetic page: none of
     the linked addresses exist. -->
<main>
<h1>Frames at the edges</h1>
<section><h2>In the page</h2><p>A link in the page itself: <a id="top-link" href="/f/edges-top">Edges top link</a>.</p></section>
<iframe id="notice" title="A notice from the other site" style="height:60px"></iframe>
<section id="other-section"><h2>A frame from the other site</h2><iframe id="other" title="From the other site"></iframe></section>
<section><h2>A frame this page sent to the other site</h2><iframe id="away" title="Sent away"></iframe></section>
<iframe id="zero" title="No size" style="width:0;height:0;border:0"></iframe>
<iframe id="offscreen" title="Off the page" style="position:absolute;left:-9999px;top:0;width:300px;height:100px"></iframe>
<section><h2>Frames inside a closed component</h2><div id="component"></div></section>
</main>
<script>
const port = location.port ? ':' + location.port : '';
const other = location.protocol + '//' + (location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1') + port;
const folder = location.pathname.replace(/[^/]*$/, '');
const $ = (id) => document.getElementById(id);
$('notice').src = other + folder + 'leaf.html?edges-notice';
$('other').src = other + folder + 'leaf.html?edges-other';
$('away').contentWindow.location = other + folder + 'leaf.html?edges-away';
$('zero').src = other + folder + 'leaf.html?edges-zero';
$('offscreen').src = other + folder + 'leaf.html?edges-offscreen';
const component = $('component').attachShadow({mode: 'closed'});
const style = 'display:block;width:100%;height:96px;border:1px solid #cbd3c5';
component.innerHTML = `<iframe title="Sandboxed, written in the page" sandbox style="${style}" srcdoc="&lt;a href='/f/edges-sealed'&gt;Sealed srcdoc link&lt;/a&gt;"></iframe>`
  + `<iframe title="Hidden, from the other site" style="display:none" src="${other}${folder}leaf.html?edges-hidden"></iframe>`
  + `<iframe title="Visible, from the other site" style="${style}" src="${other}${folder}leaf.html?edges-visible"></iframe>`;
// For the checks only: whether every frame from another site has loaded (until then each holds
// an empty page of this site, which the page can read), and a change the page makes: it removes the
// notice (so every frame after it moves up one place) and adds a frame from a third site (which
// Chrome places after the others, wherever it sits in the page).
const third = location.protocol + '//third.localhost' + port;
window.fixtureFramesLoaded = () => [...document.querySelectorAll('iframe[src], #away'), ...component.querySelectorAll('iframe[src]')].every((frame) => { try { return frame.contentDocument === null; } catch { return true; } });
window.fixtureChange = () => { $('notice').remove(); const frame = document.createElement('iframe'); frame.title = 'Added later'; frame.style.cssText = 'width:120px;height:60px'; frame.src = third + folder + 'leaf.html?edges-added'; $('other-section').before(frame); };
</script>
</html>
