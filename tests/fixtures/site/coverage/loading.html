<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frames still loading — coverage fixture</title>
<style>body{margin:0;background:#f3f0e8;color:#26342e;font:16px/1.6 system-ui}main{max-width:760px;margin:auto;padding:24px}a{color:#1f6655}iframe{display:block;width:100%;height:80px;border:1px solid #cbd3c5}.far{height:4000px}</style>
<!-- Frames that are not ready, for 0.6.0: two that never finish loading (the suite's server holds
     slow.html open), one from this site and one from the other site, and two lazy frames far below
     the window, from this site and the other one, which Chrome hasn't loaded yet. A capture must
     not wait for any of them, and says the lazy ones weren't read. -->
<main>
<h1>Frames still loading</h1>
<p>A link in the page itself: <a id="top-link" href="/f/loading-top">Loading top link</a>.</p>
<iframe id="slow-same" title="Never finishes, from this site" src="slow.html"></iframe>
<iframe id="slow-other" title="Never finishes, from the other site"></iframe>
<div class="far"></div>
<iframe id="lazy" title="Not loaded yet" loading="lazy" src="leaf.html?lazy"></iframe>
<iframe id="lazy-other" title="Not loaded yet, from the other site" loading="lazy"></iframe>
</main>
<script>
const port = location.port ? ':' + location.port : '';
const other = location.protocol + '//' + (location.hostname === '127.0.0.1' ? 'localhost' : '127.0.0.1') + port + location.pathname.replace(/[^/]*$/, '');
document.getElementById('slow-other').src = other + 'slow.html';
document.getElementById('lazy-other').src = other + 'leaf.html?lazy-other';
</script>
</html>
